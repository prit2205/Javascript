<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Maker</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #main{
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        h1{
            background: #000;
            color: white;
            font-size: 2rem;
            text-align: center;
            padding: 10px;
        }
        input{
            height: 1.5rem;
        }
        .card{
            width: 200px;
            height: auto;
            border: 2px solid lightgrey;
            border-radius: 16px;
            padding: 20px 10px;
            margin: 1rem;
            background-color: lightgray;
        }
        .img-div{
            overflow: hidden;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid black;
        }
        .img-div img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    

    </style>
</head>
<body>
    <h1>Create Your Card</h1>
    <div id="main">
    <form>
        <input type="text" placeholder="profile img link">
        <br><br>
        <input type="text" placeholder="Username">
        <br><br>
        <input type="text" placeholder="occupation">
        <br><br>
        <input type="text" placeholder="Gender">
        <br><br>
        <input type="email" placeholder="Email">
        <br><br>
        <input type="tel" placeholder="Phone Number">
        <br>
        <input type="submit" value="Create Card">
    </form>
</div>
