<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Executive Profile Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<style>
@keyframes premiumEnter {
    0% { opacity: 0; transform: translateY(50px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

.profile-card {
    animation: premiumEnter 0.9s cubic-bezier(.16,1,.3,1) forwards;
}
</style>

</head>

<body class="min-h-screen flex items-center justify-center
             bg-gradient-to-br from-gray-100 to-gray-200
             p-8">

<div class="w-full max-w-6xl profile-card">

    <div class="bg-white rounded-3xl shadow-2xl
                grid lg:grid-cols-5 overflow-hidden
                transition duration-500 hover:-translate-y-2 hover:shadow-3xl">

        <!-- LEFT SIDEBAR -->
        <div class="lg:col-span-2 bg-black text-white
                    flex flex-col items-center justify-center
                    relative p-14">

            <!-- Subtle background glow -->
            <div class="absolute w-60 h-60 bg-white/5 rounded-full blur-3xl"></div>

            <img src="https://randomuser.me/api/portraits/men/10.jpg"
                 class="w-36 h-36 rounded-full object-cover
                        border-4 border-white shadow-xl relative z-10">

            <h2 class="mt-8 text-2xl font-semibold tracking-wide relative z-10">
                John Smith
            </h2>

            <p class="text-gray-400 text-sm mt-3 relative z-10">
                UI / UX Designer
            </p>

            <span class="mt-6 text-xs px-4 py-2 rounded-full
                         bg-white/10 border border-white/20 relative z-10">
                ● Active Member
            </span>

        </div>

        <!-- RIGHT CONTENT -->
        <div class="lg:col-span-3 p-14">

            <!-- Header -->
            <div>
                <h3 class="text-2xl font-semibold text-gray-900">
                    Professional Overview
                </h3>
                <p class="text-gray-500 text-sm mt-2">
                    Contact and availability information
                </p>
            </div>

            <!-- Info Section -->
            <div class="mt-12 grid sm:grid-cols-2 gap-y-10 gap-x-16">

                <div>
                    <p class="text-xs uppercase tracking-widest text-gray-400">
                        Phone
                    </p>
                    <p class="mt-3 text-lg font-medium text-gray-900">
                        +91 98765 43210
                    </p>
                </div>

                <div>
                    <p class="text-xs uppercase tracking-widest text-gray-400">
                        Email
                    </p>
                    <p class="mt-3 text-lg font-medium text-gray-900">
                        johnsmith@email.com
                    </p>
                </div>

                <div>
                    <p class="text-xs uppercase tracking-widest text-gray-400">
                        Location
                    </p>
                    <p class="mt-3 text-lg font-medium text-gray-900">
                        Ahmedabad, India
                    </p>
                </div>

                <div>
                    <p class="text-xs uppercase tracking-widest text-gray-400">
                        Availability
                    </p>
                    <p class="mt-3 text-lg font-medium text-green-600">
                        Open for Projects
                    </p>
                </div>

            </div>

            <!-- Action Buttons -->
            <div class="mt-16 flex gap-6">

                <button class="px-10 py-4 rounded-xl bg-black text-white
                               text-sm font-semibold tracking-wide
                               transition duration-300 hover:bg-gray-800">
                    View Profile
                </button>

                <button class="px-10 py-4 rounded-xl border border-black
                               text-sm font-semibold tracking-wide
                               transition duration-300
                               hover:bg-gray-100">
                    Send Message
                </button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
