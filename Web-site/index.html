<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoptipia | Modern Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pt-20">

    <nav class="fixed top-0 left-0 w-full bg-white shadow-sm z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <i class="fa-solid fa-bag-shopping text-green-600 text-xl"></i>
                <span class="text-xl font-bold italic tracking-tight">Shoptipia</span>
            </a>
            <div class="hidden md:flex gap-8 text-sm font-semibold uppercase tracking-wide">
                <a href="index.html" class="text-green-600">Home</a>
                <a href="shop.html" class="hover:text-green-600 transition">Shop</a>
                <a href="about.html" class="hover:text-green-600 transition">About</a>
                <a href="contact.html" class="hover:text-green-600 transition">Contact</a>
            </div>
            <div class="flex items-center gap-5">
                <button class="hover:text-green-600"><i class="fa-solid fa-magnifying-glass"></i></button>
                <a href="cart.html" class="relative group">
                    <i class="fa-solid fa-bag-shopping text-xl group-hover:text-green-600 transition"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-black text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center">0</span>
                </a>
            </div>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-6 mb-16">
        <div class="bg-zinc-900 rounded-[2rem] overflow-hidden relative min-h-[400px] flex items-center">
            <div class="absolute inset-0 opacity-40">
                <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1200&auto=format&fit=crop" class="w-full h-full object-cover" alt="Banner">
            </div>
            <div class="relative z-10 p-8 md:p-16 max-w-2xl">
                <span class="text-green-400 font-bold tracking-widest uppercase text-sm">Flash Sale is Live</span>
                <h1 class="text-4xl md:text-6xl font-extrabold text-white mt-4 leading-tight">Quality essentials for your lifestyle.</h1>
                <p class="text-gray-300 mt-6 text-lg">Discover the best deals on beauty, tech, and home decor items. Updated daily.</p>
                <button class="mt-8 bg-white text-black px-10 py-4 rounded-full font-bold hover:bg-green-500 hover:text-white transition-all transform hover:scale-105">
                    Start Shopping
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pb-24">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-4">
            <div>
                <h2 class="text-3xl font-black uppercase tracking-tighter">New Arrivals</h2>
                <div class="h-1 w-20 bg-green-600 mt-2"></div>
            </div>
            <div class="flex gap-2">
                <button onclick="fetchProducts('beauty')" class="px-4 py-2 rounded-full border border-gray-200 text-sm font-medium hover:bg-black hover:text-white transition">Beauty</button>
                <button onclick="fetchProducts('fragrances')" class="px-4 py-2 rounded-full border border-gray-200 text-sm font-medium hover:bg-black hover:text-white transition">Fragrances</button>
                <button onclick="fetchProducts('furniture')" class="px-4 py-2 rounded-full border border-gray-200 text-sm font-medium hover:bg-black hover:text-white transition">Furniture</button>
            </div>
        </div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10">
            <div class="col-span-full py-20 text-center text-gray-400">
                <i class="fa-solid fa-circle-notch animate-spin text-4xl mb-4"></i>
                <p>Curating your collection...</p>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 py-12">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
            <p class="text-gray-500 text-sm">&copy; 2026 Shoptipia. Powered by DummyJSON.</p>
            <div class="flex gap-6 grayscale opacity-60">
                <i class="fa-brands fa-cc-visa text-3xl"></i>
                <i class="fa-brands fa-cc-mastercard text-3xl"></i>
                <i class="fa-brands fa-cc-apple-pay text-3xl"></i>
                <i class="fa-brands fa-cc-paypal text-3xl"></i>
            </div>
        </div>
    </footer>

    <script>
        const productGrid = document.getElementById('product-grid');

        async function fetchProducts(category = '') {
            let url = 'https://dummyjson.com/products?limit=12';
            if(category) url = `https://dummyjson.com/products/category/${category}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                renderProducts(data.products);
            } catch (error) {
                productGrid.innerHTML = `<p class="col-span-full text-center text-red-500 font-bold">Error loading products. Please refresh.</p>`;
            }
        }

        function renderProducts(products) {
            productGrid.innerHTML = '';
            
            products.forEach(product => {
                // Calculate original price based on discount
                const originalPrice = (product.price / (1 - product.discountPercentage / 100)).toFixed(2);
                
                const card = document.createElement('div');
                card.className = 'group';
                card.innerHTML = `
                    <div class="relative bg-white rounded-3xl overflow-hidden mb-5 border border-transparent group-hover:border-gray-100 transition-all duration-300">
                        <div class="aspect-[4/5] overflow-hidden bg-gray-50 flex items-center justify-center p-8">
                            <img src="${product.thumbnail}" alt="${product.title}" class="w-full h-full object-contain mix-blend-multiply group-hover:scale-110 transition duration-700">
                        </div>
                        
                        <div class="absolute top-4 left-4 flex flex-col gap-2">
                            <span class="bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter shadow-sm">
                                ${product.category}
                            </span>
                            ${product.stock < 10 ? `<span class="bg-red-500 text-white px-3 py-1 rounded-full text-[10px] font-bold shadow-sm">Low Stock</span>` : ''}
                        </div>

                        <div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity flex items-end justify-center pb-6">
                            <button class="bg-black text-white px-8 py-3 rounded-xl font-bold text-sm transform translate-y-4 group-hover:translate-y-0 transition-all duration-300 hover:bg-green-600">
                                <i class="fa-solid fa-plus mr-2"></i> Add to Bag
                            </button>
                        </div>
                    </div>

                    <div class="px-2">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-bold text-gray-900 group-hover:text-green-600 transition truncate pr-4">${product.title}</h3>
                            <div class="flex items-center text-xs font-bold">
                                <i class="fa-solid fa-star text-yellow-400 mr-1"></i>
                                <span>${product.rating}</span>
                            </div>
                        </div>
                        <p class="text-gray-400 text-xs mb-3 line-clamp-2 leading-relaxed">${product.description}</p>
                        <div class="flex items-center gap-3">
                            <span class="text-lg font-black text-black">$${product.price}</span>
                            <span class="text-sm text-gray-400 line-through font-medium">$${originalPrice}</span>
                            <span class="text-green-600 text-xs font-bold">${Math.round(product.discountPercentage)}% OFF</span>
                        </div>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        // Initial Load
        fetchProducts();
    </script>
</body>
</html>
