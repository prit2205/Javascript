<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Move Effect</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            background-color: black;
        }
        .box{
            width: 10px;
            height: 10px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            transition: cubic-bezier(0.19, 1, 0.22, 1) 0s;
        }
    </style>
</head>
<body>
    
    <div class="box"></div>

    <script src="mousemove.js"></script>
</body>
</html>
